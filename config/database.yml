default: &default
  adapter: postgresql
  encoding: unicode
  pool: 5
  timeout: 5000
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: band_app_development

test:
  <<: *default
  database: band_app_test

production:
  <<: *default
  database: band_app_production
  url: <%= ENV['DATABASE_URL'] %>
