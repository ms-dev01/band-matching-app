default: &default
  adapter: postgresql
  encoding: unicode
  timeout: 5000
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: band_app_development

test:
  <<: *default
  database: band_app_test

production:
  primary:
    <<: *default
    url: <%= ENV['DATABASE_URL'] %>
